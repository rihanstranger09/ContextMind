services:
  falkordb:
    image: falkordb/falkordb:v4.12.0
    # Local host tooling only; never bind the database to a public interface.
    ports: ["127.0.0.1:6380:6379"]
    volumes:
      - graph_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      GRAPH_BACKEND: falkordb
      FALKOR_HOST: falkordb
      FALKOR_GRAPH: ${FALKOR_GRAPH:-contextmind}
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    depends_on:
      falkordb:
        condition: service_healthy
volumes:
  graph_data:
