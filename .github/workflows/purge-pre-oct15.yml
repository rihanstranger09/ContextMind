name: Purge pre-cutoff artifacts
on:
  push:
    branches: ['tmp/purge-pre-oct15']
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
  actions: write
  contents: write
jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Purge artifacts that predate 2026-10-15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          REPORT=purge-report.txt
          : > "$REPORT"

          log() { echo "$*" | tee -a "$REPORT"; }

          attempt() {
            label="$1"; shift
            log ""
            log "### $label"
            out=$("$@" 2>&1)
            rc=$?
            if [ "$rc" -eq 0 ]; then
              log "RESULT: SUCCESS"
            else
              log "RESULT: FAILED (exit $rc)"
            fi
            printf '%s\n' "$out" | sed 's/^/    /' | tee -a "$REPORT"
          }

          log "repo=$REPO"
          log "token-actor: $(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/user | sed -n 's/.*"\(login\|message\)":"\([^"]*\)".*/\1=\2/p' | head -1)"

          attempt "REST DELETE issue #6"      gh api --method DELETE "repos/$REPO/issues/6"
          attempt "REST PATCH issue #6 closed" gh api --method PATCH "repos/$REPO/issues/6" -f state=closed

          NODE=$(gh api "repos/$REPO/issues/6" --jq '.node_id' 2>/dev/null)
          log ""
          log "issue #6 node_id: ${NODE:-<unavailable>}"
          if [ -n "$NODE" ] && [ "$NODE" != "null" ]; then
            attempt "GraphQL deleteIssue" gh api graphql -f query="mutation{ deleteIssue(input:{issueId:\"$NODE\"}){ clientMutationId } }"
          fi

          attempt "REST DELETE PR #1"         gh api --method DELETE "repos/$REPO/pulls/1"
          PRNODE=$(gh api "repos/$REPO/pulls/1" --jq '.node_id' 2>/dev/null)
          log ""
          log "PR #1 node_id: ${PRNODE:-<unavailable>}"
          if [ -n "$PRNODE" ] && [ "$PRNODE" != "null" ]; then
            attempt "GraphQL archivePullRequest" gh api graphql -f query="mutation{ archivePullRequest(input:{pullRequestId:\"$PRNODE\"}){ clientMutationId } }"
          fi

          log ""
          log "### verification"
          log "issues: $(gh api "repos/$REPO/issues" --jq '[.[] | select(.pull_request == null) | "\(.number):\(.state)"] | join(", ")' 2>&1)"
          log "pr1: $(gh api "repos/$REPO/pulls/1" --jq '.number' 2>&1 | head -1)"
          log "old_runs: $(gh api "repos/$REPO/actions/runs?per_page=100" --jq '[.workflow_runs[] | select(.created_at < "2026-10-15")] | length' 2>&1)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"
          git commit -m "purge report" >/dev/null 2>&1
          git push origin "HEAD:${{ github.ref_name }}" 2>&1 | tail -2
