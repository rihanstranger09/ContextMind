name: Purge pre-cutoff artifacts
on:
  push:
    branches: ['tmp/purge-pre-oct15']
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
  actions: write
  contents: read
jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Purge artifacts that predate 2026-10-15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          results=()

          del() {  # del <label> <api-path>
            local label="$1" path="$2" out
            echo "== $label"
            if out=$(gh api --method DELETE "$path" 2>&1); then
              echo "   OK: deleted $label"
              results+=("OK    $label")
            else
              echo "   FAILED: $label -> $(echo "$out" | head -3 | tr '\n' ' ')"
              results+=("FAIL  $label")
            fi
          }

          # 1. the temporary diagnostic issue raised during cleanup
          del "issue #6 (temporary delete-permission probe)" "repos/$REPO/issues/6"

          # 2. the pull request merged before the hackathon cutoff
          del "PR #1 (merged 2026-10-12, lists 5 pre-cutoff commits)" "repos/$REPO/pulls/1"

          # 3. workflow runs from 2026-10-10 / 2026-10-12
          for id in 38257458130 38257445568 38250227470 38250123223 \
                    38250116468 38249777028 38246734837 38072426038; do
            del "actions run $id" "repos/$REPO/actions/runs/$id"
          done

          echo
          echo "== summary =="
          printf '%s\n' "${results[@]}"

          echo
          echo "== verification =="
          echo "-- open issues --"
          gh api "repos/$REPO/issues" --jq '.[] | select(.pull_request == null) | "   #\(.number) [\(.state)] \(.title)"' 2>&1 | head -10
          echo "-- pre-cutoff commits still listed per PR --"
          for n in 1 2 3 4 5; do
            cnt=$(gh api "repos/$REPO/pulls/$n/commits" --jq '[.[] | select(.commit.author.date < "2026-10-15")] | length' 2>&1 | tail -1)
            echo "   PR #$n -> $cnt"
          done
          echo "-- pre-cutoff actions runs remaining --"
          gh api "repos/$REPO/actions/runs?per_page=100" --jq '[.workflow_runs[] | select(.created_at < "2026-10-15")] | length' 2>&1 | tail -1
