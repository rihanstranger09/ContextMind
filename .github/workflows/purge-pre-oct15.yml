name: Purge pre-cutoff artifacts
on:
  push:
    branches: ['tmp/purge-pre-oct15']
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
  actions: write
  contents: read
jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Purge artifacts that predate 2026-10-15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          ann() {  # ann <level> <text>
            local level="$1"; shift
            local msg="$*"
            msg="${msg//$'\n'/ }"
            echo "::$level::$msg"
            echo "$msg"
          }

          try() {  # try <label> <shell-command...>
            local label="$1"; shift
            local out rc
            out=$("$@" 2>&1); rc=$?
            if [ $rc -eq 0 ]; then
              ann "notice" "OK   $label :: $(echo "$out" | head -2 | tr '\n' ' ')"
            else
              ann "error" "FAIL $label :: $(echo "$out" | head -4 | tr '\n' ' ')"
            fi
            return 0
          }

          ann "notice" "actor=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/user | jq -r '.login // .message')"

          # --- 1. the temporary probe issue ---
          try "REST DELETE issue #6" \
            gh api --method DELETE "repos/$REPO/issues/6"
          try "REST PATCH issue #6 -> closed" \
            gh api --method PATCH "repos/$REPO/issues/6" -f state=closed
          NODE=$(gh api "repos/$REPO/issues/6" --jq '.node_id' 2>/dev/null)
          if [ -n "$NODE" ] && [ "$NODE" != "null" ]; then
            try "GraphQL deleteIssue $NODE" \
              gh api graphql -f query="mutation{ deleteIssue(input:{issueId:\"$NODE\"}){ clientMutationId } }"
          fi

          # --- 2. the pull request merged before the cutoff ---
          try "REST DELETE PR #1" \
            gh api --method DELETE "repos/$REPO/pulls/1"
          PRNODE=$(gh api "repos/$REPO/pulls/1" --jq '.node_id' 2>/dev/null)
          if [ -n "$PRNODE" ] && [ "$PRNODE" != "null" ]; then
            try "GraphQL archivePullRequest $PRNODE" \
              gh api graphql -f query="mutation{ archivePullRequest(input:{pullRequestId:\"$PRNODE\"}){ clientMutationId } }"
          fi

          # --- 3. verification ---
          ann "notice" "VERIFY issues=$(gh api "repos/$REPO/issues" --jq '[.[] | select(.pull_request == null)] | length' 2>/dev/null)"
          ann "notice" "VERIFY pr1=$(gh api "repos/$REPO/pulls/1" --jq '.number' 2>/dev/null || echo deleted)"
          ann "notice" "VERIFY old_runs=$(gh api "repos/$REPO/actions/runs?per_page=100" --jq '[.workflow_runs[] | select(.created_at < "2026-10-15")] | length' 2>/dev/null)"
